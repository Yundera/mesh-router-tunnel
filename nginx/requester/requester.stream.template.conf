# Raw TCP relay for the routed tunnel: the gateway connects to this box's WireGuard
# address on :443 and its TLS goes to Caddy untouched (no HTTP, no TLS termination here).
# Rendered to /etc/nginx/conf.d/requester-stream.main: OpenResty includes conf.d/*.main
# at the main level (conf.d/*.conf lands inside http {}).
stream {
server {
    listen 443;

    resolver 127.0.0.11 valid=30s;
    # Variable so the target is resolved per connection: Caddy may start after us
    set $target "${ROUTING_TARGET_HOST}:${ROUTING_TARGET_PORT_HTTPS}";

    proxy_connect_timeout 5s;
    # Idle timeout between reads: long enough for WebSockets and slow uploads
    proxy_timeout 1h;
    proxy_pass $target;
}
}
